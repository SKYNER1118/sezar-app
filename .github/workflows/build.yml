name: Build Android Native Executable

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: G++ Derleyicisini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: C++ Kodunu Derle
        run: |
          g++ -O2 main.cpp -o sezar_app -static-libstdc++

      - name: Çıktıyı Dosya Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Sezar-Uygulamasi
          path: sezar_app
